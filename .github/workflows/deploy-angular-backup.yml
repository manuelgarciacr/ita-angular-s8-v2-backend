
name: Angular backup CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

    #   - name: Instalar dependencias
    #     run: npm ci

    #   - name: Crear entorno de producción
    #     env:
    #       MONGO_URL: ${{ secrets.MONGO_URL }}
    #       PORT: ${{ secrets.PORT }}
    #     run: |
    #       node -e '
    #       const fs = require("node:fs");
    #       const env = {
    #         MONGO_URL: process.env.MONGO_URL,
    #         PORT: process.env.PORT
    #       };
    #       if (!env.MONGO_URL || !env.PORT) {
    #         console.error("Falta configurar MONGO_URL o PORT");
    #         process.exit(1);
    #       }
    #       fs.writeFileSync(
    #         ".env",
    #         "MONGO_URL=" + env.MONGO_URL + "\n" + "PORT=" + env.PORT + "\n"
    #       );
    #       '

    #   - name: Compilar Angular para producción
    #     run: npm run build-prod

    #   - name: Comprobar la compilación
    #     run: test -s dist/ita-angular-s8-v2/index.html

      - name: Instalar herramientas de despliegue
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard-tools rsync

      - name: Conectar a WireGuard
        env:
          WIREGUARD_PRIVATE_KEY: ${{ secrets.WIREGUARD_PRIVATE_KEY }}
        run: |
          sudo install -m 600 /dev/null /etc/wireguard/wg0.conf
          printf '[Interface]\nPrivateKey = %s\nAddress = 10.8.0.250/32\n\n[Peer]\nPublicKey = 8prB1igFewKtHFbckik0CQwnylRB1OSlyfAx+oCA6UM=\nEndpoint = 82.223.104.217:51820\nAllowedIPs = 10.8.0.1/32\nPersistentKeepalive = 25\n' "$WIREGUARD_PRIVATE_KEY" | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0

      - name: Configurar SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' '10.8.0.1 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHzMwCa/GcWW2CU7FTt1XRjQWGP31eeajZ6DwqLA5dRi' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Verificar conexión SSH
        run: |
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -i "$HOME/.ssh/id_ed25519" webdeploy@10.8.0.1 'whoami'

      - name: Deploy
        run: |
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -i "$HOME/.ssh/id_ed25519" webdeploy@10.8.0.1 'bash -s' << 'EOF'
          set -e
          set -o pipefail

          if [ ! -d /var/www/html/nodejs/ita-angular-s8-v2-backend ]; then
              # git clone --filter=blob:none https://github.com/manuelgarciacr/ita-angular-s8-v2-backend.git /var/www/html/nodejs/ita-angular-s8-v2-backend
              git clone --filter=blob:none git@github.com:manuelgarciacr/ita-angular-s8-v2-backend.git /var/www/html/nodejs/ita-angular-s8-v2-backend   
          else
              cd /var/www/html/nodejs/ita-angular-s8-v2-backend
              git fetch origin
              git reset --hard origin/main
          fi

          cd /var/www/html/nodejs/ita-angular-s8-v2-backend
          git sparse-checkout set --no-cone "package.json" "ecosystem.config.js" "src/" "bin/"
          npm install --omit=dev

          # 1. Verify config file exists
          [ -f ecosystem.config.js ] || { echo "ERROR: ecosystem.config.js not found"; exit 1; }
          
          #echo "$(id)"

          # 2. Remove stale PM2 entry to force reading the file
          pm2 delete ita-angular-s8-v2-backup 2>/dev/null || true

          # 3. Start from file (no cached config)
          pm2 start ecosystem.config.js --env production || { echo "ERROR: pm2 start failed"; exit 1; }

          # 4. Save process list
          pm2 save || { echo "ERROR: pm2 save failed"; exit 1; }

          # 5. Verify process is online
          sleep 6
          status=$(pm2 jlist | jq -r '.[] | select(.name == "ita-angular-s8-v2-backup") | .pm2_env.status')
          [[ $status == "online" ]] || { echo "ERROR: process is not online"; exit 1; }

          # 6. Verify app actually responds
          curl -sf --max-time 10 https://manuelgc.eu:3200/health > /dev/null || { echo "ERROR: app not responding"; exit 1; }
          
          echo "Deploy completed successfully"
          EOF
                